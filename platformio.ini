; Ham shack clock for an ESP32-2432S028R "Cheap Yellow Display".

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; TLS + Wi-Fi + display fonts don't fit the default 1.2 MB app slot.
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    tzapu/WiFiManager@2.0.17
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
    ; TFT_eSPI setup for the CYD (ILI9341 on HSPI; touch has its own VSPI bus).
    ; If colours look inverted, try -DST7789_DRIVER instead (two-USB-port CYDs).
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
